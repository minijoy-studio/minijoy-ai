# FLIXO Command Center Worker
name = "flixo-command-center-api"
main = "worker.js"
compatibility_date = "2026-11-27"

[vars]
FLIXO_ALLOWED_ORIGINS = ""

# Preview deployments use their own isolated D1 database.
# Production keeps its existing FLIXO_DB binding unchanged.
[[previews.d1_databases]]
binding = "FLIXO_DB"
database_id = "7345c3a4-f5a6-44ec-aa11-a68d40315ae4"
