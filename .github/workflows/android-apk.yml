name: Build MINIJOY PHONE AI APK

on:
  push:
    branches: [main]
    paths:
      - "PHONE-AI/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: PHONE-AI/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minijoy-phone-ai-debug
          path: PHONE-AI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
